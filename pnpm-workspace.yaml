# Single-package repo. pnpm reads its settings from this file (not the package.json `pnpm` field).

# Supply-chain cooldown: never install a dependency version published within the last 7 days (10080 min) — a compromised
# release is usually detected and yanked within hours to days. ncu (≥22) inherits this and minimumReleaseAgeExclude (no
# `cooldown` in .ncurc.cjs — one there would override the inheritance).
minimumReleaseAge: 10080
# @alienfast/* is first-party — we publish it, so the cooldown would only add friction with no security benefit.
minimumReleaseAgeExclude:
  - '@alienfast/*'

# pnpm blocks dependency build scripts (postinstall, etc.) by default; only packages mapped to `true` here may run them.
# Add others pnpm reports during install via `pnpm approve-builds`.
allowBuilds: {}
